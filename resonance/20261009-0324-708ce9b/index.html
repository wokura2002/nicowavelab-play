      else if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  };
})();
</script>
<script>
// 通信の確認用（?debug=1 の表示）: WebRTC の接続をつかまえておき、つながっている経路（TURN の中継か直接か、UDP か TCP か）・
// 回線そのものの往復時間・1 秒あたりの送信量を、Net が 1 秒ごとに __nwlNetPoll() で調べて __nwlNetInfo から読む
(function () {
  var O = window.RTCPeerConnection;
  if (!O) return;
  var pcs = [];
  var last = null;
  window.RTCPeerConnection = function (a, b) {
    var pc = new O(a, b);
    // 閉じた接続は持ち続けない（試合のたびに溜まらないように）
    pcs = pcs.filter(function (p) { return p.connectionState !== 'closed'; });
    pcs.push(pc);
    return pc;
  };
  window.RTCPeerConnection.prototype = O.prototype;
  window.__nwlNetInfo = '';
  function kind(c) {
    if (!c) return '?';
    if (c.candidateType === 'relay') return 'TURN中継(' + (c.relayProtocol || c.protocol) + ')';
    if (c.candidateType === 'host') return '直接(同じネットワーク,' + c.protocol + ')';
    return '直接(' + c.candidateType + ',' + c.protocol + ')';
  }
  window.__nwlNetPoll = function () {
    var pc = null;
    for (var i = pcs.length - 1; i >= 0; i--) if (pcs[i].connectionState === 'connected') { pc = pcs[i]; break; }
    if (!pc) { window.__nwlNetInfo = ''; return; }
    pc.getStats().then(function (s) {
      var tr = null, pair = null;
      s.forEach(function (r) { if (r.type === 'transport') tr = r; });
      if (!tr) return;
      s.forEach(function (r) { if (r.type === 'candidate-pair' && r.id === tr.selectedCandidatePairId) pair = r; });
      var now = performance.now();
      var rate = last && now > last.t ? ((tr.bytesSent - last.b) / (now - last.t)).toFixed(1) + 'KB/s' : '?';
      last = { t: now, b: tr.bytesSent };
      var rtt = pair && pair.currentRoundTripTime != null ? Math.round(pair.currentRoundTripTime * 1000) + 'ms' : '?';
      window.__nwlNetInfo = kind(pair && s.get(pair.localCandidateId)) + ' ⇄ ' + kind(pair && s.get(pair.remoteCandidateId)) +
        '  回線の往復 ' + rtt + '  送信 ' + rate;
    }).catch(function () {});
  };
})();
</script>
<script>
// コマ数の上限（スマホの発熱を抑える）: ゲームは JavaScriptBridge から window.__nwlCapFps(コマ数) を呼ぶ（0 で外す）。
// Godot の Web 版で Engine.max_fps を使うと、待つ間を空回りで潰してメインスレッドが 100% 忙しくなる（docs/performance.md）ので、
// ブラウザの requestAnimationFrame を間引く（Emscripten の main loop は毎回 globalThis.requestAnimationFrame を呼ぶ）。
// 間引いた後のコマでは、そのとき並んでいる呼び出しを全部まとめて呼ぶ（本物の requestAnimationFrame と同じく、同じ時刻を渡す）。
// 前の作り（各ゲームの cap_fps）は呼び出しごとに順番を待たせていたので、ほかに毎コマ頼み続ける呼び出し（CrazyGames の SDK の
// fps の計測。ゲームが遊び始めたと知らせたその場で頼むので、毎回ゲームより先に並ぶ）があると、毎回そちらが先に通ってゲームが止まった
// （2026-10-08。CrazyGames のスマホで、横にすると真っ黒・音だけ鳴る。tools/check-portal.mjs --mobile で確かめる）
(function () {
  var raf = window.requestAnimationFrame.bind(window);
  var caf = window.cancelAnimationFrame.bind(window);
  var interval = 0;
  var next = 0;
  var queue = [];
  var ticking = false;
  var seq = 0;
  function tick(ts) {
    // 画面の更新の揺れで1コマ飛ばさないよう、間隔の 1/4 の手前から動かす。遅れたら追いつかずに今から数え直す
    if (ts >= next - interval / 4) {
      next = Math.max(next + interval, ts);
      var q = queue;
      queue = [];
      for (var i = 0; i < q.length; i++) {
        try { q[i][1](ts); } catch (e) { setTimeout(function () { throw e; }); }
      }
    }
    if (queue.length) raf(tick);
    else ticking = false;
  }
  function request(cb) {
    var id = ++seq;
    queue.push([id, cb]);
    if (!ticking) {
      ticking = true;
      raf(tick);
    }
    return id;
  }
  function cancel(id) {
    for (var i = 0; i < queue.length; i++) {
      if (queue[i][0] === id) {
        queue.splice(i, 1);
        return;
      }
    }
  }
  window.__nwlCapFps = function (cap) {
    if (cap > 0) {
      interval = 1000 / cap;
      window.requestAnimationFrame = request;
      window.cancelAnimationFrame = cancel;
    } else {
      // 外す: もう並んでいる呼び出しは次のコマで呼ぶ（tick が残りを片付ける）
      interval = 0;
      next = 0;
      window.requestAnimationFrame = raf;
      window.cancelAnimationFrame = caf;
    }
  };
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":6377444,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
